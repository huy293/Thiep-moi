  <circle cx="50" cy="50" r="35" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.5" />

  <!-- Graduation Cap -->
  <!-- Mortarboard top -->
  <path d="M 15 45 L 50 25 L 85 45 L 50 65 Z" fill="#ffffff" stroke="#00ffff" stroke-width="3" />
  
  <!-- Mortarboard base -->
  <path d="M 30 55 L 30 75 Q 50 85 70 75 L 70 55" fill="none" stroke="#ff00ff" stroke-width="4" />
  
  <!-- Tassel base -->
